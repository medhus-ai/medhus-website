name: Plan Review

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  fanout:
    if: ${{ github.event.label.name == 'plan-files-committed' || github.event.label.name == 'plan-needs-revision' }}
    runs-on: [self-hosted, "project-medhus-website"]
    concurrency:
      group: plan-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Health check
        run: ./.github/scripts/auth-check.sh --runner code-reviewer

      - name: Budget check
        run: ./.github/scripts/budget-check.sh --issue "${{ github.event.issue.number }}" --workflow plan-review --runner code-reviewer
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Capture run start
        id: run_context
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Fan out to installed specialists, post scorecards, aggregate, flip label
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./.github/scripts/plan-review-runner.js --issue "${{ github.event.issue.number }}"

      - name: Record success
        if: success()
        run: ./.github/scripts/budget-record.sh --issue "${{ github.event.issue.number }}" --workflow plan-review --runner code-reviewer --result success --started-at "${{ steps.run_context.outputs.started_at }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Failure handling
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          node ./.github/scripts/github-api.js comment --issue "${{ github.event.issue.number }}" --body "Plan-review workflow failed; see Actions logs."
          node ./.github/scripts/github-api.js label-edit --issue "${{ github.event.issue.number }}" --add-label "blocked"
          ./.github/scripts/budget-record.sh --issue "${{ github.event.issue.number }}" --workflow plan-review --runner code-reviewer --result failure --started-at "${{ steps.run_context.outputs.started_at }}" || true
